[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puente"
version = "0.1.0"
description = "Deliver warehouse rows to SaaS APIs without losing or duplicating them: retries, idempotency, a review queue, reconciliation and a Zoho CRM payee mapping."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
mock = ["fastapi>=0.110", "uvicorn>=0.29"]
databricks = ["databricks-sql-connector>=3.0"]
dev = ["fastapi>=0.110", "uvicorn>=0.29", "pytest>=8", "duckdb>=1.0"]

[project.scripts]
puente = "puente.cli:main"

[tool.setuptools.packages.find]
include = ["puente*", "mock_saas*", "mock_zoho*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
